# Added by the review board's fork CI only (never part of the upstream PR): runs the platforms the
# repository's own CI doesn't cover, against the PR's merge commit.
name: Review platforms

on:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  macos:
    name: macos (clippy, test)
    runs-on: macos-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust (stable + clippy)
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: cargo test
        if: ${{ !cancelled() }}
        run: cargo test --workspace --locked --no-fail-fast
  windows:
    name: windows (clippy, test)
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust (stable + clippy)
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: cargo test
        if: ${{ !cancelled() }}
        run: cargo test --workspace --locked --no-fail-fast
