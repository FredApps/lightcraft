name: Windows ARM64
'on':
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - labeled
  workflow_dispatch: null
concurrency:
  group: windows-arm64-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  windows-arm64:
    uses: storytold/craft-common-actions/.github/workflows/windows-arm64.yml@817ac1cb88936f3861021f55b1700650b35874c5
    with:
      app-name: lightcraft
      app-dir: LightCraft
      install-relative-path: Programs/ArtCraft/LightCraft
      install-scope: perUser
