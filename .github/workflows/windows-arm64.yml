name: Windows ARM64
'on':
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - labeled
  workflow_dispatch: null
concurrency:
  group: windows-arm64-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  windows-arm64:
    uses: storytold/craft-common-actions/.github/workflows/windows-arm64.yml@841376d7a9f75ac1b19ea19e7530c6e0b64a5d6e
    with:
      app-name: lightcraft
      app-dir: LightCraft
      install-relative-path: Programs/ArtCraft/LightCraft
      install-scope: perUser
