name: Windows ARM64
'on':
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - labeled
  workflow_dispatch: null
concurrency:
  group: windows-arm64-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  windows-arm64:
    uses: storytold/craft-common-actions/.github/workflows/windows-arm64.yml@52dc54c75edf4e8e3355a89dde77b596d7a025e4
    with:
      app-name: lightcraft
      app-dir: LightCraft
      install-relative-path: Programs/ArtCraft/LightCraft
      install-scope: perUser
